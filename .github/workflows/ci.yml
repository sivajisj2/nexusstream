name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://nexus:ci-only-password@localhost:5432/nexus
      NEXUS_API_KEY: ci-only-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p nexus-api --test database -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:js
      - name: Black-box acceptance
        run: |
          cargo run --locked -p nexus-api > /tmp/nexus.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS localhost:8080/readyz; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
          npm run test:e2e
      - name: Container build
        run: docker build -t nexusstream:ci .
